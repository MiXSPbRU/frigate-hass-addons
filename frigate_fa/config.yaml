name: "Frigate Legacy (0.13.2)"
version: "0.13.2"
slug: "frigate_old"
description: "NVR with realtime local object detection for IP cameras (YAML config)"
url: "https://github.com"
image: "ghcr.io/blakeblackshear/frigate:0.13.2"
startup: application
boot: auto
init: false
ingress: true
ingress_port: 5000
ingress_entry: /
panel_icon: "mdi:cctv"
panel_title: Frigate
homeassistant_api: true
hassio_api: true
host_network: false
tmpfs: true
video: true
privileged:
  - SYS_ADMIN
ports:
  5000/tcp: null
  1935/tcp: null
  8554/tcp: null
services:
  - "mqtt:want"
arch:
  - amd64
  - aarch64
map:
  - "media:rw"
  - "share:rw"
  - "homeassistant_config:rw"
